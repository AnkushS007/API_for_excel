<!doctype html>
<html><head><meta charset="utf-8"><title>AM4 Rapid Growth Assistant</title>
<style>
body{font-family:Arial;background:#111;color:#eee;width:430px;padding:16px}
button{padding:9px;margin:4px;border:0;border-radius:8px;cursor:pointer}
.card{background:#1b1d22;border-radius:12px;padding:14px;margin:10px 0}
.muted{color:#999}.metric{display:inline-block;min-width:90px;margin:7px 4px 0 0}
.metric b{font-size:16px}.metric small{color:#999}.ok{color:#8fe3a8}.warn{color:#ffc76b}
</style></head>
<body>
<h2>🚀 AM4 Rapid Growth Assistant</h2>
<div id="status" class="muted">Loading…</div>
<div class="card"><b>Live airline state</b><div id="stats"></div></div>
<div class="card"><b>What should I do next?</b><div id="next" class="muted">Analyzing…</div></div>
<div class="card"><b>Captured API categories</b><div id="cats" class="muted"></div></div>
<button id="diagnostic">Download diagnostic snapshot</button>
<button id="clear">Clear data</button>
<button id="refresh">Refresh</button>
<script src="popup.js"></script>
</body></html>
